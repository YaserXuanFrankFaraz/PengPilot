<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PengPilot — Inbox / 看板 / 小队 交互稿</title>
  <style>
    :root {
      --canvas: #1a1a1a;
      --sidebar: #181818;
      --surface: #1a1a1a;
      --raised: #232323;
      --composer: #212121;
      --inset: #151515;
      --overlay: rgba(226, 230, 237, 0.05);
      --overlay-strong: rgba(226, 230, 237, 0.09);
      --item: rgba(240, 240, 240, 0.06);
      --border: rgba(226, 230, 237, 0.07);
      --border-strong: rgba(226, 230, 237, 0.14);
      --text: #e2e2e2;
      --text-2: #a3a3a3;
      --text-3: #7d7d7d;
      --text-4: #575757;
      --accent: #e2795b;
      --success: #62c987;
      --warning: #e0b36a;
      --danger: #e2726a;
      --favorite: #eab308;
      --inverse: #e7e9ec;
      --on-inverse: #17181c;
      --code: #e0a882;
      --code-wash: rgba(226, 230, 237, 0.08);
      --traffic-r: #ff5f57;
      --traffic-y: #febc2e;
      --traffic-g: #28c840;
      --nav: 52px;
      --list: 280px;
      --radius: 7px;
      --shadow: 0 24px 70px -24px rgba(0, 0, 0, 0.55);
      color-scheme: dark;
    }
    html[data-theme="light"] {
      --canvas: #f6f5f6;
      --sidebar: #f3f3f3;
      --surface: #f6f5f6;
      --raised: #ececec;
      --composer: #ffffff;
      --inset: #e6e6e6;
      --overlay: rgba(20, 24, 32, 0.05);
      --overlay-strong: rgba(20, 24, 32, 0.09);
      --item: rgba(20, 20, 20, 0.06);
      --border: rgba(20, 24, 32, 0.08);
      --border-strong: rgba(20, 24, 32, 0.15);
      --text: #242424;
      --text-2: #666666;
      --text-3: #858585;
      --text-4: #a4a4a4;
      --accent: #c85f44;
      --success: #2f8f52;
      --warning: #a66b20;
      --danger: #c64a42;
      --favorite: #ca8a04;
      --inverse: #202227;
      --on-inverse: #f8f8f9;
      --code: #9a5528;
      --code-wash: rgba(20, 24, 32, 0.07);
      --shadow: 0 24px 70px -28px rgba(0, 0, 0, 0.28);
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font: 13px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(226, 121, 91, 0.12), transparent 50%),
        #0e0e0e;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    html[data-theme="light"] body {
      background:
        radial-gradient(1200px 600px at 50% -10%, rgba(200, 95, 68, 0.10), transparent 50%),
        #d9d6d2;
    }
    button, input { font: inherit; color: inherit; }
    button { border: 0; background: none; cursor: pointer; padding: 0; }
    .page {
      min-height: 100%;
      display: flex;
      flex-direction: column;
      padding: 28px 32px 24px;
      gap: 16px;
    }
    .toolbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      max-width: 1320px;
      margin: 0 auto;
      width: 100%;
    }
    .toolbar h1 {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 600;
    }
    .toolbar p {
      margin: 0;
      color: var(--text-3);
      font-size: 12px;
    }
    .scenes {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }
    .chip {
      height: 28px;
      padding: 0 10px;
      border-radius: 8px;
      border: 1px solid var(--border-strong);
      background: rgba(255,255,255,0.03);
      color: var(--text-2);
      font-size: 12px;
    }
    .chip:hover { background: var(--overlay-strong); color: var(--text); }
    .chip[aria-pressed="true"] {
      background: var(--inverse);
      color: var(--on-inverse);
      border-color: transparent;
    }
    .stage {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
    }
    .window {
      width: min(1280px, 100%);
      height: min(780px, calc(100vh - 120px));
      display: flex;
      flex-direction: column;
      background: var(--canvas);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .window.compact { width: 760px; }
    .chrome {
      height: 48px;
      display: flex;
      align-items: center;
      padding: 0 12px 0 14px;
      gap: 10px;
      flex: none;
    }
    .lights { display: flex; gap: 7px; }
    .lights i {
      width: 11px; height: 11px; border-radius: 50%;
      box-shadow: inset 0 0 0 0.5px rgba(0,0,0,0.25);
    }
    .lights .r { background: var(--traffic-r); }
    .lights .y { background: var(--traffic-y); }
    .lights .g { background: var(--traffic-g); }
    .chrome-title {
      flex: 1;
      text-align: center;
      color: var(--text-3);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .kbd {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: var(--text-4);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 1px 5px;
    }
    .body { flex: 1; display: flex; min-height: 0; }
    .nav {
      width: var(--nav);
      flex: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0 10px;
      gap: 4px;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
    }
    .nav-btn {
      width: 34px; height: 34px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      color: var(--text-3);
      position: relative;
    }
    .nav-btn:hover { background: var(--overlay); color: var(--text-2); }
    .nav-btn[aria-current="true"] {
      background: var(--item);
      color: var(--text);
    }
    .nav-btn[data-zone="nav"].zone { outline: 1.5px solid var(--accent); outline-offset: 1px; }
    .nav-btn svg { width: 16px; height: 16px; }
    .nav-btn .dot {
      position: absolute; top: 6px; right: 6px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
    }
    .nav-spacer { flex: 1; }
    .list-pane {
      width: var(--list);
      flex: none;
      display: flex;
      flex-direction: column;
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      min-width: 0;
    }
    .list-pane[data-zone="list"].zone { box-shadow: inset 0 0 0 1.5px var(--accent); }
    .list-head {
      padding: 8px 12px 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .list-head h2 {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      flex: 1;
    }
    .icon-btn {
      width: 26px; height: 26px;
      border-radius: 6px;
      display: grid; place-items: center;
      color: var(--text-3);
    }
    .icon-btn:hover { background: var(--overlay); color: var(--text); }
    .icon-btn[aria-pressed="true"] { background: var(--item); color: var(--text); }
    .search {
      margin: 0 12px 8px;
      height: 28px;
      border-radius: 7px;
      background: var(--overlay);
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 0 8px;
      color: var(--text-3);
    }
    .search input {
      border: 0; outline: none; background: none; width: 100%;
      color: var(--text);
      font-size: 12.5px;
    }
    .new-task {
      margin: 0 12px 8px;
      height: 30px;
      border-radius: 7px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      color: var(--text-2);
    }
    .new-task:hover { background: var(--item); }
    .rows { flex: 1; overflow: auto; padding: 0 8px 10px; }
    .group {
      font-size: 11.5px;
      color: var(--text-3);
      font-weight: 500;
      padding: 8px 8px 4px;
    }
    .row {
      width: 100%;
      text-align: left;
      border-radius: var(--radius);
      padding: 7px 8px;
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 1px;
    }
    .row:hover { background: var(--overlay); }
    .row[aria-current="true"] { background: var(--item); }
    .row-top {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .row-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13.5px;
    }
    .flag { color: var(--favorite); font-size: 10px; }
    .pulse {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--success) 22%, transparent);
    }
    .row-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-3);
      font-size: 11.5px;
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .status i {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--text-4);
    }
    .status.todo i { background: var(--text-3); }
    .status.progress i { background: var(--accent); }
    .status.review i { background: #7aa2f7; }
    .status.blocked i { background: var(--warning); }
    .status.done i { background: var(--success); }
    .cli {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      color: var(--text-3);
      background: var(--code-wash);
      border-radius: 4px;
      padding: 1px 4px;
    }
    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--surface);
    }
    #mainBody {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }
    .main[data-zone="detail"].zone { box-shadow: inset 0 0 0 1.5px var(--accent); }
    .detail-bar {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      color: var(--text-2);
      font-size: 12.5px;
    }
    .detail-bar strong { color: var(--text); font-weight: 550; }
    .grow { flex: 1; }
    .transcript {
      flex: 1;
      overflow: auto;
      padding: 22px 28px 12px;
    }
    .bubble {
      max-width: 78%;
      margin-left: auto;
      background: var(--item);
      border-radius: 10px 10px 4px 10px;
      padding: 8px 12px;
      margin-bottom: 18px;
    }
    .rule {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-4);
      font-size: 11.5px;
      margin: 8px 0 16px;
    }
    .rule::before, .rule::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-strong);
    }
    .md { max-width: 720px; color: var(--text-2); }
    .md p { margin: 0 0 10px; }
    .md code {
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: var(--code);
      background: var(--code-wash);
      border-radius: 4px;
      padding: 1px 5px;
    }
    .tool {
      margin: 12px 0;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--inset) 70%, transparent);
      border-radius: 8px;
      overflow: hidden;
    }
    .tool-h {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 12px;
      color: var(--text-2);
    }
    .plus { color: var(--success); margin-left: auto; }
    .minus { color: var(--danger); }
    .composer-wrap { padding: 8px 16px 10px; }
    .composer {
      background: var(--composer);
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 10px 12px 8px;
    }
    .composer textarea {
      width: 100%;
      border: 0;
      outline: none;
      resize: none;
      background: none;
      color: var(--text);
      min-height: 42px;
      font: inherit;
    }
    .composer-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-3);
      font-size: 12px;
    }
    .send {
      margin-left: auto;
      width: 28px; height: 28px;
      border-radius: 50%;
      background: var(--inverse);
      color: var(--on-inverse);
      display: grid; place-items: center;
    }
    .foot {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 20px 10px;
      color: var(--text-3);
      font-size: 12px;
    }
    .board {
      flex: 1;
      display: flex;
      gap: 10px;
      padding: 12px;
      overflow: auto;
      background: var(--surface);
    }
    .matrix {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 8px;
      padding: 10px 12px 12px;
      min-height: 0;
      background: var(--surface);
    }
    .quad {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: color-mix(in srgb, var(--raised) 55%, var(--surface));
      overflow: hidden;
    }
    .quad.q1 { box-shadow: inset 3px 0 0 var(--accent); }
    .quad.q2 { box-shadow: inset 3px 0 0 var(--success); }
    .quad.q3 { box-shadow: inset 3px 0 0 var(--warning); }
    .quad.q4 { box-shadow: inset 3px 0 0 var(--text-4); }
    .quad-h {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px 6px;
      font-size: 12.5px;
      font-weight: 600;
    }
    .quad-h span { color: var(--text-3); font-weight: 500; font-size: 11px; }
    .lanes {
      flex: 1;
      display: flex;
      min-height: 0;
      border-top: 1px solid var(--border);
    }
    .lane {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
    }
    .lane:last-child { border-right: 0; }
    .quad-tag {
      font-size: 11px;
      color: var(--text-3);
      border: 1px solid var(--border-strong);
      border-radius: 4px;
      padding: 0 5px;
      height: 18px;
      display: inline-flex;
      align-items: center;
    }
    .lane-h {
      padding: 6px 7px 4px;
      font-size: 11px;
      color: var(--text-3);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .lane .cards { padding: 0 6px 6px; gap: 6px; }
    .lane .card { padding: 7px 8px 6px; }
    .lane .card-title { font-size: 12px; margin-bottom: 6px; }
    .col {
      flex: 1 0 210px;
      min-width: 210px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }
    .col-h {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px 8px;
      color: var(--text-2);
      font-size: 12.5px;
      font-weight: 550;
    }
    .count {
      color: var(--text-4);
      font-weight: 500;
      font-size: 11.5px;
    }
    .cards {
      flex: 1;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .card {
      text-align: left;
      background: var(--raised);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 10px 8px;
    }
    .card:hover { border-color: var(--border-strong); }
    .card[aria-current="true"] { box-shadow: 0 0 0 1.5px var(--accent); }
    .card-title { font-size: 13px; margin-bottom: 8px; }
    .card-foot {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-3);
      font-size: 11px;
    }
    .avatar {
      width: 18px; height: 18px;
      border-radius: 50%;
      display: grid; place-items: center;
      font-size: 9px;
      font-weight: 600;
      background: var(--item);
      color: var(--text-2);
    }
    .avatar.squad { outline: 1px dashed var(--text-4); }
    .work {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 280px;
      min-height: 0;
    }
    .work-main { overflow: auto; padding: 22px 26px; }
    .key { color: var(--text-3); font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
    .work-main h3 { margin: 4px 0 12px; font-size: 20px; font-weight: 600; }
    .props {
      border-left: 1px solid var(--border);
      padding: 16px 16px 12px;
      overflow: auto;
      background: color-mix(in srgb, var(--sidebar) 80%, var(--surface));
    }
    .prop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 12.5px;
    }
    .prop span { color: var(--text-3); }
    .log { margin-top: 16px; }
    .log h4 { margin: 0 0 8px; font-size: 12px; color: var(--text-3); font-weight: 550; }
    .run {
      width: 100%;
      text-align: left;
      padding: 8px;
      border-radius: 7px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .run:hover { background: var(--overlay); }
    .run[aria-current="true"] { background: var(--item); }
    .comment {
      margin-top: 18px;
      padding: 10px 0;
      border-top: 1px solid var(--border);
      color: var(--text-2);
    }
    .mention { color: var(--accent); }
    .agents, .squads {
      flex: 1;
      overflow: auto;
      padding: 20px 24px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 10px;
    }
    .tile {
      text-align: left;
      border: 1px solid var(--border);
      background: var(--raised);
      border-radius: 10px;
      padding: 14px;
    }
    .tile h3 { margin: 0 0 4px; font-size: 14px; }
    .tile p { margin: 0; color: var(--text-3); font-size: 12px; }
    .modal-back {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.38);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
    }
    .modal {
      width: 420px;
      background: var(--raised);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 16px 16px 14px;
      box-shadow: var(--shadow);
    }
    .modal h3 { margin: 0 0 4px; font-size: 15px; }
    .modal .sub { color: var(--text-3); font-size: 12px; margin-bottom: 12px; }
    .pick {
      width: 100%;
      text-align: left;
      padding: 8px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pick:hover { background: var(--overlay); }
    .pick[aria-pressed="true"] { background: var(--item); }
    .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .btn {
      height: 28px;
      padding: 0 12px;
      border-radius: 7px;
      color: var(--text-2);
    }
    .btn:hover { background: var(--overlay); }
    .btn.primary {
      background: var(--inverse);
      color: var(--on-inverse);
    }
    .hidden { display: none !important; }
    .window { position: relative; }
    .hint {
      max-width: 1320px;
      margin: 0 auto;
      width: 100%;
      color: #8a8a8a;
      font-size: 12px;
    }
    html[data-theme="light"] .hint { color: #5c5c5c; }
    .sv { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  </style>
</head>
<body>
  <div class="page">
    <div class="toolbar">
      <div>
        <h1>PengPilot 交互稿</h1>
        <p>Craft 三区交互 + Multica 看板与小队 · 石墨色 GPUI 语言 · 确认后再写 Rust</p>
      </div>
      <div class="scenes">
        <button class="chip" data-scene="inbox" aria-pressed="true">未完成 + 对话</button>
        <button class="chip" data-scene="board">四象限看板</button>
        <button class="chip" data-scene="work">工作详情</button>
        <button class="chip" data-scene="agents">智能体 / 小队</button>
        <button class="chip" data-scene="assign">分配小队</button>
        <button class="chip" id="compactBtn" aria-pressed="false">紧凑宽度</button>
        <button class="chip" id="themeBtn">浅色</button>
      </div>
    </div>

    <div class="stage">
      <div class="window" id="window">
        <div class="chrome">
          <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
          <div class="chrome-title" id="chromeTitle">PengPilot — PengPilot / PP-12</div>
          <span class="kbd">⌘1</span>
          <span class="kbd">⌘2</span>
          <span class="kbd">⌘3</span>
        </div>
        <div class="body">
          <nav class="nav" data-zone="nav" id="nav">
            <button class="nav-btn" data-nav="inbox" aria-current="true" title="收件箱">
              <svg class="sv" viewBox="0 0 24 24"><path d="M4 7h16v12H4z"/><path d="M4 7l8 6 8-6"/></svg>
            </button>
            <button class="nav-btn" data-nav="flagged" title="旗标">
              <svg class="sv" viewBox="0 0 24 24"><path d="M5 4v16"/><path d="M5 5h10l-2 4 2 4H5"/></svg>
              <span class="dot"></span>
            </button>
            <button class="nav-btn" data-nav="archive" title="归档">
              <svg class="sv" viewBox="0 0 24 24"><path d="M4 7h16v3H4z"/><path d="M6 10v8h12v-8"/><path d="M10 14h4"/></svg>
            </button>
            <button class="nav-btn" data-nav="board" title="看板">
              <svg class="sv" viewBox="0 0 24 24"><path d="M4 5h5v14H4z"/><path d="M10.5 5h3.5v9h-3.5z"/><path d="M15.5 5H20v6h-4.5z"/></svg>
            </button>
            <button class="nav-btn" data-nav="agents" title="智能体与小队">
              <svg class="sv" viewBox="0 0 24 24"><circle cx="8" cy="9" r="2.4"/><circle cx="16" cy="9" r="2.4"/><path d="M4.5 17c.6-2.2 2.4-3.4 4.5-3.4S13 14.8 13.6 17"/><path d="M12.8 14.2c.8-.8 1.9-1.3 3.2-1.3 2.1 0 3.9 1.2 4.5 3.4"/></svg>
            </button>
            <div class="nav-spacer"></div>
            <button class="nav-btn" title="设置">
              <svg class="sv" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.2 6.2l1.4 1.4M18.4 16.4l1.4 1.4M3 12h2M19 12h2M4.2 17.8l1.4-1.4M18.4 7.6l1.4-1.4"/></svg>
            </button>
          </nav>

          <aside class="list-pane" data-zone="list" id="listPane">
            <div class="list-head">
              <h2 id="listTitle">收件箱</h2>
              <button class="icon-btn" id="viewList" aria-pressed="true" title="列表">
                <svg class="sv" viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
              </button>
              <button class="icon-btn" id="viewBoard" aria-pressed="false" title="看板">
                <svg class="sv" viewBox="0 0 24 24"><path d="M4 5h5v14H4zM10.5 5H14v9h-3.5zM15.5 5H20v6h-4.5z"/></svg>
              </button>
            </div>
            <button class="new-task">
              <svg class="sv" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
              新建任务
            </button>
            <div class="search">
              <svg class="sv" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M20 20l-3.5-3.5"/></svg>
              <input placeholder="搜索" />
            </div>
            <div class="rows" id="rows"></div>
          </aside>

          <section class="main" data-zone="detail" id="main">
            <div class="detail-bar" id="detailBar"></div>
            <div id="mainBody"></div>
          </section>
        </div>

        <div class="modal-back hidden" id="modal">
          <div class="modal">
            <h3>分配给小队</h3>
            <div class="sub">PP-12 · 修掉长成绩单掉帧 · 负责人改为小队后只启动队长</div>
            <button class="pick" aria-pressed="true">
              <span class="avatar squad">D</span>
              <div>
                <div>Delivery</div>
                <div class="row-meta">队长 Reviewer · Codex　成员 Frontend · Claude</div>
              </div>
            </button>
            <button class="pick">
              <span class="avatar">R</span>
              <div>
                <div>Reviewer</div>
                <div class="row-meta">档案 · Codex CLI</div>
              </div>
            </button>
            <button class="pick">
              <span class="avatar">F</span>
              <div>
                <div>Frontend</div>
                <div class="row-meta">档案 · Claude Code</div>
              </div>
            </button>
            <div class="actions">
              <button class="btn" id="assignLater">只指定，暂不开始</button>
              <button class="btn primary" id="assignStart">开始</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <p class="hint">
      键盘：1 / 2 / 3 切导航、列表、详情高亮（对应 ⌘1/2/3）。这是确认用的静态交互稿，不是应用本体。
    </p>
  </div>

  <script>
    const items = [
      { id: "pp12", key: "PP-12", title: "修掉长成绩单掉帧", project: "PengPilot", status: "progress", statusLabel: "进行中", cli: "Codex", who: "Reviewer", time: "正在跑", flagged: true, working: true, important: true, urgent: true },
      { id: "pp11", key: "PP-11", title: "看板与列表共用同一批工作", project: "PengPilot", status: "review", statusLabel: "待人审", cli: "Claude", who: "Frontend", time: "12 分钟前", flagged: false, important: true, urgent: false },
      { id: "pp10", key: "PP-10", title: "小队 mention 只启动被点名的 CLI", project: "PengPilot", status: "todo", statusLabel: "待开始", cli: "小队", who: "Delivery", time: "今天", flagged: true, important: true, urgent: true },
      { id: "pp9", key: "PP-9", title: "设置页补一段空状态说明", project: "PengPilot", status: "todo", statusLabel: "待开始", cli: "Grok", who: "", time: "今天", flagged: false, important: false, urgent: true },
      { id: "s1", key: "聊天", title: "give me a quick overview", project: "PengPilot", status: "todo", statusLabel: "待开始", cli: "Grok", who: "", time: "昨天", flagged: false, chat: true, important: false, urgent: false },
      { id: "pp8", key: "PP-8", title: "打开当时的运行记录", project: "PengPilot", status: "done", statusLabel: "完成并归档", cli: "Codex", who: "Reviewer", time: "2 天前", flagged: false, important: true, urgent: false },
      { id: "pp7", key: "PP-7", title: "整理过期的试用文案", project: "PengPilot", status: "done", statusLabel: "完成并归档", cli: "Claude", who: "Frontend", time: "3 天前", flagged: false, important: false, urgent: false },
    ];

    const params = new URLSearchParams(location.search);
    const state = {
      scene: params.get("scene") || "inbox",
      nav: params.get("nav") || "inbox",
      view: params.get("view") || "list",
      selected: params.get("item") || "pp12",
      zone: params.get("zone") || "",
      compact: params.get("compact") === "1",
      theme: params.get("theme") || "dark",
    };
    if (state.scene === "board") { state.nav = "board"; state.view = "board"; }
    if (state.scene === "agents") state.nav = "agents";
    if (state.scene === "work") { state.nav = "inbox"; state.view = "list"; }
    if (state.nav === "archive" && !params.get("item")) state.selected = "pp8";
    if (state.theme === "light") document.documentElement.dataset.theme = "light";

    const $ = (id) => document.getElementById(id);

    function filtered() {
      if (state.nav === "flagged") return items.filter((i) => i.flagged);
      if (state.nav === "archive" || state.nav === "done") return items.filter((i) => i.status === "done");
      return items.filter((i) => i.status !== "done");
    }

    function quadrantLabel(it) {
      if (it.important && it.urgent) return "重要且紧急";
      if (it.important) return "重要不紧急";
      if (it.urgent) return "紧急不重要";
      return "不紧急不重要";
    }

    function rowHtml(it) {
      const archived = it.status === "done";
      return `
        <button class="row" data-id="${it.id}" aria-current="${it.id === state.selected}">
          <div class="row-top">
            ${it.working ? '<span class="pulse"></span>' : ""}
            <span class="row-title">${it.title}</span>
            ${it.flagged ? '<span class="flag">★</span>' : ""}
          </div>
          <div class="row-meta">
            ${archived ? `<span class="quad-tag">${quadrantLabel(it)}</span>` : `<span class="status ${it.status}"><i></i>${it.statusLabel}</span>`}
            <span>${it.project}</span>
            <span class="cli">${it.cli}</span>
            <span style="margin-left:auto">${it.time}</span>
          </div>
        </button>`;
    }

    function renderRows() {
      const rows = $("rows");
      const list = filtered();
      const open = list.filter((i) => i.status !== "done");
      const rest = list.filter((i) => i.status === "done");
      let html = "";
      if (state.nav === "flagged") html += `<div class="group">旗标</div>` + list.map(rowHtml).join("");
      else if (state.nav === "archive" || state.nav === "done") html += `<div class="group">归档 · 已完成</div>` + list.map(rowHtml).join("");
      else {
        html += `<div class="group">未完成</div>` + open.map(rowHtml).join("");
      }
      rows.innerHTML = html;
      rows.querySelectorAll(".row").forEach((el) => {
        el.onclick = () => { state.selected = el.dataset.id; render(); };
      });
    }

    function cardHtml(it) {
      return `
        <button class="card" data-id="${it.id}" aria-current="${it.id === state.selected}">
          <div class="card-title">${it.flagged ? "★ " : ""}${it.title}</div>
          <div class="card-foot">
            <span class="avatar ${it.cli === "小队" ? "squad" : ""}">${(it.who || it.cli).slice(0,1)}</span>
            <span>${it.who || "未指定"}</span>
            <span class="cli">${it.cli}</span>
            <span style="margin-left:auto">${it.key}</span>
          </div>
        </button>`;
    }

    function boardHtml() {
      const stages = [
        ["todo", "待开始", ""],
        ["progress", "进行中", ""],
        ["review", "待人审", ""],
      ];
      const quads = [
        ["q1", "重要且紧急", "现在做", true, true],
        ["q2", "重要不紧急", "排进计划", true, false],
        ["q3", "紧急不重要", "可交给小队", false, true],
        ["q4", "不紧急不重要", "少做或放下", false, false],
      ];
      return `<div class="matrix">${quads.map(([id, title, hint, important, urgent]) => {
        const inQuad = items.filter((i) => i.important === important && i.urgent === urgent);
        return `<section class="quad ${id}">
          <div class="quad-h">${title}<span>${hint}</span></div>
          <div class="lanes">${stages.map(([sid, slabel, extra]) => {
            const cards = inQuad.filter((i) => i.status === sid);
            return `<div class="lane ${extra}">
              <div class="lane-h"><span class="status ${sid}"><i></i></span>${slabel}<span class="count">${cards.length}</span></div>
              <div class="cards">${cards.map(cardHtml).join("")}</div>
            </div>`;
          }).join("")}</div>
        </section>`;
      }).join("")}</div>`;
    }

    function selectedItem() {
      return items.find((i) => i.id === state.selected) || items[0];
    }

    function transcriptHtml(it) {
      return `
        <div class="transcript">
          <div class="bubble">看板列要和 Inbox 是同一批工作。小队只启动队长，成员用 @ 再开各自的 CLI。</div>
          <div class="rule">工作了 42 秒</div>
          <div class="md">
            <p>现有侧栏按日期堆会话。建议拆成导航轨 + 中间列表，成绩单仍只加载当前这一条。</p>
            <p>四象限里只有待开始 / 进行中 / 待人审。<code>PP-12</code> 现在是进行中，落在「重要且紧急」。完成并归档后离开看板，进归档并带上象限标签。</p>
            <div class="tool">
              <div class="tool-h">编辑　src/app/inbox.rs　<span class="plus">+48</span>　<span class="minus">−6</span></div>
            </div>
            <p>归档列表会标出这条完成的工作原来属于哪个象限。</p>
          </div>
        </div>
        <div class="composer-wrap">
          <div class="composer">
            <textarea placeholder="继续这条工作…　@Frontend 会另开 Claude 会话"></textarea>
            <div class="composer-bar">
              <span>${it.cli === "小队" ? "Delivery · 队长 Codex" : it.cli}</span>
              <span>·</span>
              <span>完全访问</span>
              <span>·</span>
              <span>Build</span>
              <button class="send" title="发送">↑</button>
            </div>
          </div>
        </div>
        <div class="foot">
          <span>${it.project}</span>
          <span>Local</span>
          <span>main</span>
        </div>`;
    }

    function workHtml(it) {
      return `
        <div class="work">
          <div class="work-main">
            <div class="key">${it.key}</div>
            <h3>${it.title}</h3>
            <div class="md">
              <p>把侧栏改成 Craft 那样的分诊，同时用看板看同一批工作。不要上 Electron，也不要为小队再做一个进程。</p>
              <p>验收：完成一次运行不等于工作完成；队长 @Frontend 之后才允许出现第二条 Claude 会话。</p>
            </div>
            <div class="comment">
              <strong>Reviewer</strong>
              <span class="mention"> @Frontend</span>
              列表虚拟化你来，我继续看渲染路径。
            </div>
          </div>
          <div class="props">
            <div class="prop"><span>进度</span><span class="status ${it.status}"><i></i>${it.statusLabel}</span></div>
            <div class="prop"><span>象限</span><span>${it.important && it.urgent ? "重要且紧急" : it.important ? "重要不紧急" : it.urgent ? "紧急不重要" : "不紧急不重要"}</span></div>
            <div class="prop"><span>负责人</span><span>${it.who || "未指定"} · ${it.cli}</span></div>
            <div class="prop"><span>项目</span><span>${it.project}</span></div>
            <div class="prop"><span>旗标</span><span>${it.flagged ? "已标记" : "无"}</span></div>
            <div class="log">
              <h4>执行记录</h4>
              <button class="run" aria-current="true">
                <div>Reviewer · Codex · 运行中</div>
                <div class="row-meta">分配并开始 · 刚才</div>
              </button>
              <button class="run">
                <div>Frontend · Claude · 排队</div>
                <div class="row-meta">@Frontend · 未开始</div>
              </button>
            </div>
          </div>
        </div>`;
    }

    function agentsHtml() {
      return `
        <div class="agents">
          <div class="list-head" style="padding:0 0 12px"><h2>智能体档案</h2></div>
          <div class="grid">
            <div class="tile"><h3>Reviewer</h3><p>Codex CLI · 默认审代码、不改范围</p></div>
            <div class="tile"><h3>Frontend</h3><p>Claude Code · GPUI / 列表 / 焦点</p></div>
            <div class="tile"><h3>Grok Build</h3><p>Grok · 直接用原始 CLI，没有档案也可以</p></div>
          </div>
          <div class="list-head" style="padding:22px 0 12px"><h2>小队</h2></div>
          <div class="grid">
            <button class="tile" id="openSquad">
              <h3>Delivery</h3>
              <p>队长 Reviewer（Codex）· 成员 Frontend（Claude）· 分配后只启动队长</p>
            </button>
          </div>
        </div>`;
    }

    function titles() {
      const map = { inbox: "未完成", flagged: "旗标", archive: "归档", done: "归档", board: "看板", agents: "智能体" };
      $("listTitle").textContent = map[state.nav] || "收件箱";
    }

    function renderMain() {
      const it = selectedItem();
      $("chromeTitle").textContent = `PengPilot — ${it.project} / ${it.key}`;
      const bar = $("detailBar");
      const body = $("mainBody");
      if (state.scene === "agents" || state.nav === "agents") {
        bar.innerHTML = `<strong>档案与小队</strong><span class="grow"></span><span>薄包装现有 CLI，不新开运行时</span>`;
        body.innerHTML = agentsHtml();
        body.querySelector("#openSquad")?.addEventListener("click", () => showAssign(true));
        return;
      }
      if (state.scene === "work") {
        bar.innerHTML = `<strong>${it.key}</strong><span>${it.title}</span><span class="grow"></span><button class="btn primary" id="assignBtn">分配</button>`;
        body.innerHTML = workHtml(it);
        $("assignBtn").onclick = () => showAssign(true);
        return;
      }
      if (state.view === "board" || state.scene === "board" || state.nav === "board") {
        bar.innerHTML = `<strong>四象限</strong><span>每一格：待开始 → 进行中 → 待人审　·　完成进归档</span><span class="grow"></span>`;
        body.innerHTML = boardHtml();
        body.querySelectorAll(".card").forEach((el) => {
          el.onclick = () => { state.selected = el.dataset.id; state.scene = "work"; syncChips(); render(); };
        });
        return;
      }
      bar.innerHTML = `<strong>${it.title}</strong><span class="grow"></span><span class="status ${it.status}"><i></i>${it.statusLabel}</span><span class="cli">${it.cli}</span>`;
      body.innerHTML = transcriptHtml(it);
    }

    function showAssign(on) {
      $("modal").classList.toggle("hidden", !on);
    }

    function applyZone() {
      document.querySelectorAll("[data-zone]").forEach((el) => {
        el.classList.toggle("zone", el.dataset.zone === state.zone);
      });
    }

    function syncChips() {
      document.querySelectorAll(".chip[data-scene]").forEach((el) => {
        el.setAttribute("aria-pressed", el.dataset.scene === state.scene);
      });
    }

    function render() {
      titles();
      document.querySelectorAll(".nav-btn[data-nav]").forEach((el) => {
        el.setAttribute("aria-current", el.dataset.nav === state.nav);
      });
      $("viewList").setAttribute("aria-pressed", state.view === "list");
      $("viewBoard").setAttribute("aria-pressed", state.view === "board");
      const hideList =
        state.nav === "agents" ||
        state.nav === "board" ||
        state.scene === "agents" ||
        state.scene === "board" ||
        state.view === "board";
      $("listPane").classList.toggle("hidden", hideList);
      renderRows();
      renderMain();
      applyZone();
      showAssign(state.scene === "assign");
      $("window").classList.toggle("compact", state.compact);
    }

    document.querySelectorAll(".chip[data-scene]").forEach((el) => {
      el.onclick = () => {
        state.scene = el.dataset.scene;
        if (state.scene === "inbox") { state.nav = "inbox"; state.view = "list"; }
        if (state.scene === "board") { state.nav = "board"; state.view = "board"; }
        if (state.scene === "work") { state.nav = "inbox"; state.view = "list"; }
        if (state.scene === "agents") { state.nav = "agents"; }
        if (state.scene === "assign") { state.nav = "inbox"; state.view = "list"; state.scene = "assign"; }
        syncChips();
        render();
      };
    });
    document.querySelectorAll(".nav-btn[data-nav]").forEach((el) => {
      el.onclick = () => {
        state.nav = el.dataset.nav;
        state.scene = el.dataset.nav === "board" ? "board" : el.dataset.nav === "agents" ? "agents" : "inbox";
        state.view = state.nav === "board" ? "board" : "list";
        syncChips();
        render();
      };
    });
    $("viewList").onclick = () => { state.view = "list"; state.scene = "inbox"; state.nav = "inbox"; syncChips(); render(); };
    $("viewBoard").onclick = () => { state.view = "board"; state.scene = "board"; state.nav = "board"; syncChips(); render(); };
    $("compactBtn").onclick = () => {
      state.compact = !state.compact;
      $("compactBtn").setAttribute("aria-pressed", state.compact);
      render();
    };
    $("themeBtn").onclick = () => {
      state.theme = state.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = state.theme;
      $("themeBtn").textContent = state.theme === "dark" ? "浅色" : "深色";
    };
    $("assignLater").onclick = () => showAssign(false);
    $("assignStart").onclick = () => showAssign(false);
    $("modal").addEventListener("click", (e) => { if (e.target.id === "modal") showAssign(false); });
    document.querySelectorAll(".modal .pick").forEach((el) => {
      el.onclick = () => {
        document.querySelectorAll(".modal .pick").forEach((p) => p.setAttribute("aria-pressed", p === el));
      };
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "1") state.zone = "nav";
      if (e.key === "2") state.zone = "list";
      if (e.key === "3") state.zone = "detail";
      if (e.key === "Escape") showAssign(false);
      applyZone();
    });

    if (state.scene === "assign") showAssign(true);
    $("themeBtn").textContent = state.theme === "dark" ? "浅色" : "深色";
    $("compactBtn").setAttribute("aria-pressed", state.compact);
    syncChips();
    render();
  </script>
</body>
</html>
