[package]
name = "pengpilot-core"
version = "0.1.20"
edition = "2024"
description = "Headless provider, persistence, and workspace runtime for PengPilot"
license = "GPL-3.0-only"

[dependencies]
agent-client-protocol = "2.0.0"
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
crossbeam-channel = "0.5"
dirs = "6.0"
nucleo-matcher = "0.3.1"
parking_lot = "0.12"
pengpilot-protocol = { path = "../pengpilot-protocol" }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rust-i18n = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2"
subtle = "2"
toml = "0.8"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pengpilot-client = { path = "../pengpilot-client" }
