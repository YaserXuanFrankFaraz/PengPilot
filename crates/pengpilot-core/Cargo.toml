[package]
name = "pengpilot-core"
version = "0.1.20"
edition = "2024"
description = "Headless provider, persistence, and workspace runtime for PengPilot"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
dirs = "6.0"
pengpilot-protocol = { path = "../pengpilot-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.18", features = ["v4", "serde"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
