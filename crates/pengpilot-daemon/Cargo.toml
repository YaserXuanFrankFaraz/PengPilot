[package]
name = "pengpilot-daemon"
version = "0.1.20"
edition = "2024"
description = "Headless PengPilot provider daemon"
license = "GPL-3.0-only"

[[bin]]
name = "pengpilot-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
pengpilot-core = { path = "../pengpilot-core" }
pengpilot-protocol = { path = "../pengpilot-protocol" }
serde_json = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
pengpilot-client = { path = "../pengpilot-client" }
uuid = { version = "1.18", features = ["v4"] }
