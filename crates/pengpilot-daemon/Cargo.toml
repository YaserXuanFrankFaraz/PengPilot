[package]
name = "pengpilot-daemon"
version = "0.1.20"
edition = "2024"
description = "Headless PengPilot provider daemon"
license = "GPL-3.0-only"

[[bin]]
name = "pengpilot-daemon"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
pengpilot-core = { path = "../pengpilot-core" }
pengpilot-protocol = { path = "../pengpilot-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
